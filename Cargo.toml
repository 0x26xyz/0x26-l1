[workspace]
members = [
    "crates/consensus",
    "crates/execution",
    "crates/state-db",
    "crates/network",
    "crates/rpc",
    "crates/policy",
    "crates/matching",
    "crates/oracle",
    "crates/feeder",
    "crates/streams",
    "crates/node",
]
# crates/loadgen and crates/market-data depend on a client SDK that is not
# part of this repository. Their sources are kept for reference and are
# excluded from the workspace so the remaining crates build standalone.
exclude = ["crates/loadgen", "crates/market-data"]
resolver = "2"

[workspace.package]
edition = "2021"
license-file = "LICENSE"
version = "0.1.0"
publish = false

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
