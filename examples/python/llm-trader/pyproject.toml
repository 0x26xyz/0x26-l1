[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "and-llm-trader"
version = "0.1.0"
description = "Example LLM-driven directional trading agent on the & chain, powered by OpenRouter"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
  { name = "0x26xyz" }
]
keywords = ["and-chain", "agent", "llm", "openrouter", "trading", "example"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "and-chain-sdk>=0.1.0",
]

[project.scripts]
and-llm-trader = "llm_trader.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
