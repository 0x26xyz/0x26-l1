and_chain_llm_trader_max_drawdown_bps: 500
and_chain_llm_trader_max_intents_per_second: 1
and_chain_llm_trader_max_intents_per_day: 1000
and_chain_llm_trader_gas_budget_per_day_microusdc: 10000000
and_chain_llm_trader_gas_refill_per_day_microusdc: 10000000
and_chain_llm_trader_policy_ttl_ms: 604800000
# BTC lot_size_microunits is 1, so 100,000 lots is 0.1 BTC.
and_chain_llm_trader_max_trade_lots: 100000
and_chain_llm_trader_max_position_lots: 100000
and_chain_llm_trader_poll_interval_s: 15
and_chain_llm_trader_openrouter_model: "deepseek/deepseek-chat"
and_chain_llm_trader_testnet_taker_cadence_enabled: true
and_chain_llm_trader_testnet_taker_size_lots: 100000
