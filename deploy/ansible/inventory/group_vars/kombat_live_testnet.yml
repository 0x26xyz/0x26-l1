# Funding-arb bot fleet (RFC 045 reference implementation). All bots
# share the existing testnet taker account/keys but isolate their
# rate-limit / volume cap surface via per-bot policies. Each bot
# fires when |mark - index| / index >= threshold_bps and pushes mark
# back toward index with an IOC sized to size_lots.
and_chain_funding_arb_bots:
  - id: tight
    policy_id: 26000301
    threshold_bps: 5
    size_lots: 100000
    poll_interval_ms: 5000
    policy_max_volume_per_day_micro_usdc: "1000000000000000000"
  - id: medium
    policy_id: 26000302
    threshold_bps: 15
    size_lots: 200000
    poll_interval_ms: 5000
    policy_max_volume_per_day_micro_usdc: "1000000000000000000"
  - id: loose
    policy_id: 26000303
    threshold_bps: 30
    size_lots: 500000
    poll_interval_ms: 5000
    policy_max_volume_per_day_micro_usdc: "1000000000000000000"
    # Loose bot also runs the noise component so candle wicks and
    # micro-volume keep ticking when mark is sitting inside the
    # tight/medium thresholds.
    noise_size_lots: 250000
    noise_probability_pct: 25

