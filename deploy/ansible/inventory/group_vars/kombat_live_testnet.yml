ansible_user: root
ansible_remote_tmp: /tmp/and-chain-ansible-tmp

and_chain_chain_id: 7
and_chain_operator_token: "{{ lookup('env', 'KOMBAT_OPERATOR_TOKEN') }}"
and_chain_binary_path: "{{ lookup('env', 'KOMBAT_BINARY_PATH') | default(playbook_dir + '/../../../target-linux-x86_64/release/kombat_chain', true) }}"
and_chain_market_data_binary_path: "{{ lookup('env', 'KOMBAT_MARKET_DATA_BINARY_PATH') | default(playbook_dir + '/../../../target-linux-x86_64/release/kombat_market_data', true) }}"
and_chain_legacy_delegation_bridge_enabled: true

and_chain_install_root: /opt/and-chain
and_chain_config_dir: /etc/and-chain
and_chain_state_dir: /var/lib/and-chain
and_chain_state_backend: redb
and_chain_mempool_fsync: sync
and_chain_mempool_group_commit_ms: 10
and_chain_user: and-chain
and_chain_group: and-chain

and_chain_market_data_hosts: "{{ lookup('env', 'KOMBAT_MARKET_DATA_HOSTS') | default('kombat_market_data', true) }}"
and_chain_market_data_service_name: kombat-market-data
and_chain_market_data_env_file: "{{ and_chain_config_dir }}/kombat-market-data.env"
and_chain_market_data_bind_host: "{{ lookup('env', 'KOMBAT_MARKET_DATA_BIND_HOST') | default('0.0.0.0', true) }}"
and_chain_market_data_port: "{{ lookup('env', 'KOMBAT_MARKET_DATA_PORT') | default('8787', true) }}"
# Testnet rollout pin: market-data reads the same validator used by the MM and
# taker bots while MAHI owner-relay/status convergence is still being hardened.
and_chain_market_data_rpc_url: "{{ lookup('env', 'KOMBAT_MARKET_DATA_RPC_URL') | default('http://203.0.113.17:8545', true) }}"
and_chain_market_data_source: "{{ lookup('env', 'KOMBAT_MARKET_DATA_SOURCE') | default('live-testnet-current', true) }}"
and_chain_market_data_poll_ms: "{{ lookup('env', 'KOMBAT_MARKET_DATA_POLL_MS') | default('500', true) }}"
and_chain_market_data_batch_limit: "{{ lookup('env', 'KOMBAT_MARKET_DATA_BATCH_LIMIT') | default('1000', true) }}"
and_chain_market_data_intervals: "{{ lookup('env', 'KOMBAT_MARKET_DATA_INTERVALS') | default('1m,5m,15m,1h,1d', true) }}"
and_chain_questdb_service_name: kombat-questdb
and_chain_questdb_image: "{{ lookup('env', 'KOMBAT_QUESTDB_IMAGE') | default('questdb/questdb:8.2.3', true) }}"
and_chain_questdb_container_name: kombat-questdb
and_chain_questdb_data_dir: "{{ and_chain_state_dir }}/questdb"
and_chain_questdb_http_port: "{{ lookup('env', 'KOMBAT_QUESTDB_HTTP_PORT') | default('9000', true) }}"
and_chain_questdb_pg_port: "{{ lookup('env', 'KOMBAT_QUESTDB_PG_PORT') | default('8812', true) }}"
and_chain_questdb_ilp_tcp_port: "{{ lookup('env', 'KOMBAT_QUESTDB_ILP_TCP_PORT') | default('9009', true) }}"

and_chain_validator_rpc_port: 8545
and_chain_ingress_services:
  - name: kombat-chain-ingress
    port: 8645
and_chain_retired_ingress_services:
  - kombat-chain-ingress2
  - kombat-chain-ingress3

# Redb-backed live testnet should leave headroom for RPC, snapshot bootstrap,
# bots, and browser traffic. The old 50ms/5000-item cadence could starve RPC
# during rolling restarts.
and_chain_auto_network_round_interval_ms: 1000
and_chain_auto_network_drive_interval_ms: 250
and_chain_auto_network_max_items: 500
and_chain_base_timeout_ms: 300
and_chain_max_timeout_ms: 20000
and_chain_max_timeout_exponent: 6
and_chain_max_clock_skew_ms: 1000

# Testnet rollout config. RFC027 MM/taker verification currently prioritizes
# deterministic end-to-end execution over the higher-throughput multi-leader path.
and_chain_mahi_commit_rule: mahi
# Temporary: force single-leader MAHI while the RFC027 MM/taker path is being
# hardened. The parser treats "1"/"true" as "enable default multileader", so
# single-leader must be expressed as "0"/"false"/"off".
and_chain_mahi_multileader: "0"
# Testnet rollout pin: keep all payload frontiers visible to the validator-1
# bot ingress path until sharded owner-relay/status convergence is proven under
# the RFC027 MM + taker workload.
and_chain_mahi_payload_sharding: "{{ lookup('env', 'KOMBAT_MAHI_PAYLOAD_SHARDING') | default('0', true) }}"
and_chain_mahi_allow_idle_empty_rounds: "1"
and_chain_mahi_observer_async_relay: "1"
and_chain_network_submit_forwarding_enabled: true
# Redb native-Mahi rollout: RFC 042 now persists chain-head and executor roots
# separately. Operators can still set KOMBAT_MAHI_LEGACY_EXEC=1 as an emergency
# compatibility pin, but resettable testnet should exercise native execution.
and_chain_mahi_legacy_exec: "{{ lookup('env', 'KOMBAT_MAHI_LEGACY_EXEC') | default('0', true) }}"
# Temporary: synchronous block broadcast keeps the resettable testnet easier to
# reason about while we verify cross-validator intent/order convergence.
and_chain_mahi_async_block_broadcast: "false"
and_chain_mahi_merged_execution_batch: 8
and_chain_mahi_owner_relay_redundancy: 2
and_chain_mahi_owner_relay_lag_rounds: 256

and_chain_faucet_k8s_namespace: "{{ lookup('env', 'KOMBAT_FAUCET_K8S_NAMESPACE') | default('pvp-platform', true) }}"
and_chain_faucet_redis_secret_name: "{{ lookup('env', 'KOMBAT_FAUCET_REDIS_SECRET_NAME') | default('and-chain-faucet-redis-secret', true) }}"
and_chain_faucet_redis_secret_key: "{{ lookup('env', 'KOMBAT_FAUCET_REDIS_SECRET_KEY') | default('REDIS_PASSWORD', true) }}"
and_chain_faucet_redis_node_host: "{{ lookup('env', 'KOMBAT_FAUCET_REDIS_NODE_HOST') | default('203.0.113.11', true) }}"
and_chain_faucet_redis_node_port: "{{ lookup('env', 'KOMBAT_FAUCET_REDIS_NODE_PORT') | default('31379', true) }}"
and_chain_faucet_redis_url: "{{ lookup('env', 'KOMBAT_FAUCET_REDIS_URL') | default('', true) }}"
and_chain_faucet_address_cooldown_secs: "{{ lookup('env', 'KOMBAT_FAUCET_ADDRESS_COOLDOWN_SECS') | default('86400', true) }}"
and_chain_faucet_ip_window_secs: "{{ lookup('env', 'KOMBAT_FAUCET_IP_WINDOW_SECS') | default('3600', true) }}"
and_chain_faucet_ip_max_claims: "{{ lookup('env', 'KOMBAT_FAUCET_IP_MAX_CLAIMS') | default('20', true) }}"
and_chain_faucet_global_window_secs: "{{ lookup('env', 'KOMBAT_FAUCET_GLOBAL_WINDOW_SECS') | default('60', true) }}"
and_chain_faucet_global_max_claims: "{{ lookup('env', 'KOMBAT_FAUCET_GLOBAL_MAX_CLAIMS') | default('1000', true) }}"

and_chain_snapshot_timer_enabled: true
and_chain_restart_services: true
and_chain_bootstrap_empty_block_timestamp_ms: "{{ lookup('env', 'KOMBAT_BOOTSTRAP_EMPTY_BLOCK_TIMESTAMP_MS') | default((lookup('pipe', 'date +%s') | int * 1000), true) }}"
and_chain_seed_timestamp_ms: "{{ lookup('env', 'KOMBAT_SEED_TIMESTAMP_MS') | default((and_chain_bootstrap_empty_block_timestamp_ms | int + 100), true) }}"
and_chain_genesis_timestamp_ms: "{{ lookup('env', 'KOMBAT_GENESIS_TIMESTAMP_MS') | default((and_chain_bootstrap_empty_block_timestamp_ms | int - 100), true) }}"
and_chain_reset_bootstrap_validator_host: validator-2
and_chain_seed_initial_state_hosts: validator-2
and_chain_seed_real_capital_demo_hosts: validator-2
and_chain_validator_remote_bootstrap_enabled: true
and_chain_local_bridge_mutations_enabled: false

