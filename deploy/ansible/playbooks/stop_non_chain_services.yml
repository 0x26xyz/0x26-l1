- name: Stop non-chain services before live chain performance experiments
  hosts: kombat_live_testnet
  gather_facts: false
  become: true
  vars:
    # Space-separated service names. Keep explicit in experiment manifests.
    non_chain_services_to_stop: "{{ lookup('env', 'KOMBAT_NON_CHAIN_SERVICES_TO_STOP') | default('nginx', true) | split() }}"
  tasks:
    - name: Capture selected non-chain service state before stop
      ansible.builtin.shell: |
        set -euo pipefail
        service="{{ item }}"
        if systemctl list-unit-files --type=service --no-legend "${service}.service" | grep -q "^${service}.service"; then
          printf '%s active=%s enabled=%s\n' \
            "${service}" \
            "$(systemctl is-active "${service}" 2>/dev/null || true)" \
            "$(systemctl is-enabled "${service}" 2>/dev/null || true)"
        else
          printf '%s absent\n' "${service}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ non_chain_services_to_stop }}"
      changed_when: false
      register: non_chain_before

    - name: Print selected non-chain service state before stop
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} {{ item.stdout }}"
      loop: "{{ non_chain_before.results }}"

    - name: Stop selected non-chain services when installed
      ansible.builtin.shell: |
        set -euo pipefail
        service="{{ item }}"
        if systemctl list-unit-files --type=service --no-legend "${service}.service" | grep -q "^${service}.service"; then
          systemctl stop "${service}"
          printf '%s stopped\n' "${service}"
        else
          printf '%s absent\n' "${service}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ non_chain_services_to_stop }}"
      register: non_chain_stop
      changed_when: "'stopped' in non_chain_stop.stdout"

    - name: Capture selected non-chain service state after stop
      ansible.builtin.shell: |
        set -euo pipefail
        service="{{ item }}"
        if systemctl list-unit-files --type=service --no-legend "${service}.service" | grep -q "^${service}.service"; then
          printf '%s active=%s enabled=%s\n' \
            "${service}" \
            "$(systemctl is-active "${service}" 2>/dev/null || true)" \
            "$(systemctl is-enabled "${service}" 2>/dev/null || true)"
        else
          printf '%s absent\n' "${service}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ non_chain_services_to_stop }}"
      changed_when: false
      register: non_chain_after

    - name: Print selected non-chain service state after stop
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} {{ item.stdout }}"
      loop: "{{ non_chain_after.results }}"
